version: "3.9"

services:
  db:
    image: postgres:15
    container_name: org_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: org_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: org_app
    depends_on:
      - db
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/org_db
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data: